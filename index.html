<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Каталог настільних ігор</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <h1>Каталог настільних ігор</h1>
            <nav>
                <a href="#categories">Категорії</a>
                <a href="#players_count">Кількість гравців</a>
            </nav>
        </header>
        <main>
            <section id="filters">
                <h2>Фільтри</h2>
                <details>
                    <summary>Відкрити фільтри</summary>

                    <form>
                        <h3 id="categories">Категорії</h3>
                        <input type="checkbox" name="category" id="all" checked>
                        <label for="all">Всі</label> <br>

                        <input type="checkbox" name="category" id="strategic">
                        <label for="strategic">Стратегія</label> <br>

                        <input type="checkbox" name="category" id="logic_puzzles">
                        <label for="logic_puzzles">Логічні головоломки</label> <br>

                        <input type="checkbox" name="category" id="card_based">
                        <label for="card_based">Карткові</label> <br>

                        <input type="checkbox" name="category" id="games_of_chance">
                        <label for="games_of_chance">Ігри на удачу</label> <br>

                        <input type="checkbox" name="category" id="economic">
                        <label for="economic">Економічні</label> <br>

                        <h3 id="players_count">Кількість гравців</h3>
                        <input type="checkbox" name="players" id="1">
                        <label for="1">1</label> <br>

                        <input type="checkbox" name="players" id="2">
                        <label for="2">2</label> <br>

                        <input type="checkbox" name="players" id="3">
                        <label for="3">3</label> <br>

                        <input type="checkbox" name="players" id="4">
                        <label for="4">4</label> <br>

                        <input type="checkbox" name="players" id="5plus">
                        <label for="5plus">5+</label> <br> <br> 

                        <button type="submit">Застосувати</button>
                    </form>
                </details>
            </section>

            <section  id="games">
                <h2>Ігри</h2>
                <ul>
                    <li>
                        <article id="chess" class="game">
                            <h3>Шахи</h3>
                            <img src="assets/img/chess.webp" alt="Шахи">
                        </article>
                    </li>

                    <li>
                        <article id="monopoly" class="game">
                            <h3>Монополія</h3>
                            <img src="assets/img/monopoly.jpg" alt="Монополія">
                        </article>
                    </li>

                    <li>
                        <article id="fool" class="game">
                            <h3>Дурень</h3>
                            <img src="assets/img/fool.jpg" alt="Дурень">
                        </article>
                    </li>

                    <li>
                        <article id="battleship" class="game">
                            <h3>Морський бій</h3>
                            <img src="assets/img/battleship.webp" alt="Морський бій">
                        </article>
                    </li>

                    <li>
                        <article id="backgammon" class="game">
                            <h3>Нарди</h3>
                            <img src="assets/img/backgammon.png" alt="Нарди">
                        </article>
                    </li>

                    <li>
                        <article id="jenga" class="game">
                            <h3>Дженга</h3>
                            <img src="assets/img/jenga.webp" alt="Дженга">
                        </article>
                    </li>

                    <li>
                        <article id="alias" class="game">
                            <h3>Аліас</h3>
                            <img src="assets/img/alias.jpg" alt="Аліас">
                        </article>
                    </li>

                    <li>
                        <article id="Scrabble" class="game">
                            <h3>Скрабл</h3>
                            <img src="assets/img/scrabble.jpg" alt="Скрабл">
                        </article>
                    </li>
                </ul>

            </section>
        </main>

        <footer>
            <p>Автор: Конфорович Богдан</p>
        </footer>
        <script src="js/app.js"></script>
    </body>
</html>
